plugins {
    id 'io.qameta.allure' version '3.0.1'
    id 'com.netflix.dgs.codegen' version '8.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureVersion = '2.32.0'
def aspectJVersion = '1.9.22'
def junitVersion = '6.0.2'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation "io.qameta.allure:allure-junit5"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation "org.junit.jupiter:junit-jupiter"

    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.hibernate.orm:hibernate-core"
    testImplementation "jakarta.persistence:jakarta.persistence-api"
    testImplementation "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "com.netflix.graphql.dgs:graphql-dgs"
    implementation "org.springframework.data:spring-data-commons"
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testCompileOnly "org.projectlombok:lombok"
    testAnnotationProcessor "org.projectlombok:lombok"

    testImplementation "net.datafaker:datafaker:2.4.2"
    testImplementation "org.apache.commons:commons-lang3"

    testImplementation "org.springframework.security:spring-security-crypto"

    testImplementation "com.atomikos:transactions-jdbc:6.0.0:jakarta"
    testImplementation "com.atomikos:transactions-jta:6.0.0:jakarta"

    testImplementation "com.codeborne:selenide:7.2.1"
    testImplementation 'com.github.h-thurow:simple-jndi:0.25.0'

    testImplementation "com.mysql:mysql-connector-j"
}

allure {
    version = allureVersion
}

generateJava {
    schemaPaths = ["${projectDir}/src/test/resources/graphql"]
    packageName = 'io.student.rangiffler.model'
    generateClient = false
    generatedSourcesDir = "${layout.buildDirectory.get().asFile}/generated/sources/dgs-codegen"
    language = 'JAVA'
    typeMapping = [
            'UserConnection': 'org.springframework.data.domain.Page<io.student.rangiffler.model.types.User>',
            'PhotoConnection': 'org.springframework.data.domain.Page<io.student.rangiffler.model.types.Photo>',
            'Date': 'java.time.LocalDateTime'
    ]
}

sourceSets {
    test {
        java {
            srcDir('src/test/java')
            srcDir("$buildDir/generated/sources/dgs-codegen")
        }
    }
}

compileTestJava {
    dependsOn 'generateJava'
}

test {
    useJUnitPlatform()
    jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]
}
