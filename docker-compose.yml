services:
  mysql:
    image: mysql:8.4.7
    container_name: rfr-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mysql-volume:/var/lib/mysql

volumes:
  mysql-volume:
    name: mysql-volume
