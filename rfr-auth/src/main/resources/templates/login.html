<!DOCTYPE HTML>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Login to Rangiffler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" th:href="@{/images/favicon.ico}"/>
    <script>
        (function () {
            var saved = document.cookie.match(/(?:^|; )rangiffler-theme=(light|dark)/);
            var theme = saved ? saved[1]
                : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.classList.add(theme);
        })();
    </script>
    <link href="../static/styles/styles.css" th:href="@{/styles/styles.css(v=3)}" rel="stylesheet"
          type="text/css"/>
</head>
<body>
<main class="content">
    <div class="content__wrapper">
        <div class="main__hero"></div>
        <section class="main__form">
            <h1 class="header">
                <span class="header__logo" role="img" aria-label="Rangiffler logo"></span>
                <span><span class="header__accent">R</span>angiffler</span>
            </h1>
            <p class="header__subtitle">Welcome back! Sign in to share your travels.</p>
            <form class="form" action="#" th:action="@{/login}" method="post">
                <div th:if="${param.error}">
                    <p class="form__error form__alert">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</p>
                </div>
                <div th:if="${param.logout}">
                    <p class="text-warning">You have been logged out.</p>
                </div>
                <label class="form__label">Username
                    <input class="form__input"
                           type="text"
                           name="username"
                           placeholder="Type your username"
                           autocomplete="false"
                           required/>
                </label>
                <label class="form__label">Password
                    <input class="form__input"
                           type="password"
                           name="password"
                           placeholder="Type your password"
                           autocomplete="false"
                           required/>
                    <button type="button" class="form__password-button" aria-label="Show password"></button>
                </label>
                <button class="form__submit" type="submit">
                    Sign in
                </button>
                <p class="form__paragraph">Have no account? <a class="form__link" th:href="@{/register}"
                                                               href="/register">Sign up</a></p>
            </form>
        </section>
    </div>
</main>
<script>
    const passwordButton = document.querySelector(".form__password-button");
    const passwordInput = document.querySelector("[name=password]");

    const togglePasswordInputType = (inputType) => {
        return inputType === "password" ? "text" : "password";
    }

    const togglePasswordButtonClass = () => {
        passwordButton.classList.toggle("form__password-button_active");
    }

    const handlePasswordButtonClick = () => {
        passwordInput.setAttribute("type", togglePasswordInputType(passwordInput.getAttribute("type")));
        togglePasswordButtonClass();
    }

    passwordButton.addEventListener("click", handlePasswordButtonClick);
</script>
</body>
</html>
